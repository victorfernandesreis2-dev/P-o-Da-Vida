/* ===== Pão da Vida · identidade editorial premium ===== */
:root{
 --bg:#f2efe7;--paper:#fffdf8;--ink:#172536;--muted:#687382;
 --accent:#b48a42;--accent-soft:#f1e5cd;--accent-line:#d8c39a;--accent-dark:#75531f;
 --line:#e4ded1;--shadow:0 10px 30px rgba(19,31,45,.075);
 --navy:#14263b;--navy2:#203a55;--gold:#c6a15b;--wine:#733e46;--emerald:#315d50;
}
body{font-family:Inter,"Aptos","Segoe UI",system-ui,-apple-system,Arial,sans-serif;letter-spacing:-.12px;background:var(--bg);color:var(--ink)}
h1,.section-title,.hero h2,.profile-info h2{font-family:Inter,"Aptos","Segoe UI",system-ui,sans-serif;font-weight:780;letter-spacing:-.75px}
h1{font-size:22px;color:var(--navy)}
.top{padding:17px 18px 13px}
.logo{background:linear-gradient(145deg,#d8b56f,#89652d);border:1px solid #e4cb91;box-shadow:0 6px 18px #76531f30}
.tag{font-size:11px;letter-spacing:.2px}
.profile-shortcut{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:var(--navy);color:#f8e9c5;font-size:20px;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 13px #14263b28}
.profile-shortcut img{width:100%;height:100%;object-fit:cover}
.content{padding:6px 16px 26px}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,rgba(15,31,48,.95),rgba(25,49,69,.79)),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85') center 48%/cover;border:1px solid #b48a42;border-radius:23px;padding:23px;color:#fffaf0;box-shadow:0 15px 34px rgba(17,34,51,.18)}
.hero:after{content:"";position:absolute;inset:9px;border:1px solid rgba(220,190,128,.45);border-radius:16px;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 13px,rgba(220,190,128,.035) 13px 14px)}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:#e3c783;letter-spacing:2px;font-size:10px}
.hero h2{font-size:27px;line-height:1.12;color:#fff;margin:10px 0}
.hero p{color:#e2e5e8;line-height:1.5}
.hero .verse{font-family:Georgia,serif;font-size:17px;color:#fff8e8}
.hero .ref{color:#e4c98d}
.hero .btn{background:var(--gold);color:#172536}
.hero .btn.light{background:rgba(255,255,255,.13);color:#fff;border:1px solid #ffffff50}
.ornament{color:#e4c783;padding:0 5px}
.section-title{font-size:20px;color:var(--navy);margin-top:23px}
.card,.tile{border:1px solid #e3dccd;border-radius:17px;background:var(--paper);box-shadow:0 7px 22px rgba(22,36,52,.055)}
.tile{min-height:112px;padding:16px;border-top:3px solid var(--gold)}
.tile .ico{font-size:25px}
.tile b{font-size:14px;color:var(--navy)}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:11px 15px;font-weight:700;letter-spacing:.05px;box-shadow:0 4px 10px rgba(20,38,59,.12)}
.btn.light{background:#eee4d1;color:#60471e;box-shadow:none}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid #c8b78f;box-shadow:none}
.field{border:1px solid #d8d1c4;background:#fffefa;border-radius:11px;padding:12px;color:var(--ink)}
.field:focus{outline:2px solid #c6a15b55;border-color:#b48a42}
.bottom{background:rgba(255,253,248,.96);border-top:1px solid #dcd4c5;box-shadow:0 -5px 20px rgba(24,37,51,.06)}
.nav{padding-top:9px;justify-content:flex-start;scrollbar-width:thin}
.nav button{font-size:10px;font-weight:650;gap:4px;min-width:58px;flex:0 0 58px}

.nav button.active span{background:#eee2c8;border-radius:10px;padding:2px 9px}
.notice{background:#f1eadc;color:#5e5038;border-left:3px solid var(--gold);border-radius:9px}
.pill{background:#e9dfc9;color:#624b22;font-weight:700}
.progress{background:#e6e0d5;height:9px}
.progress i{background:linear-gradient(90deg,#a47a35,#d4b36e)}
.book{border-radius:12px;border-color:#ded7ca;background:#fffefa}
.book b{color:var(--navy)}
.chaptergrid button{background:#fffefa;border-color:#ddd5c6;color:var(--navy);font-weight:650}
.verse-row{border-color:#e9e2d7}
.verse-num{color:#9a712d}
.verse-actions button{background:#eee4d1;color:#60471e}
.post{color:#28384a}
.modalbox{border:1px solid #d7c59e;box-shadow:0 -12px 40px #0e1c2b30}

.profile-panel{display:flex;align-items:center;gap:13px;padding:16px;background:linear-gradient(115deg,#172b40,#29465d);color:#fff;border:1px solid #c6a15b;border-radius:18px;margin:6px 0 18px;box-shadow:0 9px 24px #172b4024}

.profile-info{min-width:0;flex:1}

.gold-btn{background:#c6a15b;color:#172536;padding:9px 12px}
.profile-editor{display:grid;gap:9px}

.hymn-entry{display:flex;align-items:center;gap:12px;margin:12px 0;padding:13px 14px;background:linear-gradient(105deg,#172b40,#29465d);border:1px solid #c6a15b;border-radius:14px;color:#fff;cursor:pointer;box-shadow:0 7px 17px #172b4020}

.hymn-entry span{font-size:11px;color:#e2e7eb}
.hymn-arrow{font-size:25px;color:#e4c783}
.hymn-list{display:grid;gap:8px}

@media(max-width:390px){
 .hero{padding:19px}.hero h2{font-size:24px}.profile-panel{gap:9px;padding:12px}.profile-avatar{width:52px;height:52px;flex-basis:52px}
 .nav button{font-size:9px;min-width:43px}.nav button span{font-size:18px}
 .hymn-item{flex-wrap:wrap}.hymn-title{min-width:calc(100% - 48px)}
}


.streak-card{margin:14px 0 20px;padding:18px;border-radius:19px;color:#fff9ec;background:linear-gradient(120deg,#14263b,#294761);border:1px solid #c6a15b;box-shadow:0 11px 25px rgba(20,38,59,.17);position:relative;overflow:hidden}

.streak-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.streak-kicker{font-size:10px;font-weight:800;letter-spacing:1.8px;color:#e4c783}
.streak-number{font-size:37px;line-height:1.12;font-weight:850;letter-spacing:-1.5px;margin:5px 0}
.streak-number small{font-size:13px;font-weight:650;letter-spacing:0;color:#f1e6d1}
.streak-caption{font-size:12px;color:#d7e0e8}
.streak-flame{width:49px;height:49px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#e4c783,#a77c38);color:#172a40;font-size:27px;box-shadow:0 5px 15px #0003}

.streak-bottom{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#e6e9ec;position:relative;z-index:1}
.streak-button{margin-top:14px;background:#d3b36f;color:#172a40;box-shadow:none;position:relative;z-index:1}
.streak-install{margin-top:9px;background:#ffffff14;border:1px solid #d9bd7d;color:#fff5dc;position:relative;z-index:1;width:100%}.streak-warning{margin-top:12px;padding:10px 12px;border-radius:12px;background:#ffffff12;border:1px solid #ffffff30;color:#f6e8c9;font-size:12px;line-height:1.5;position:relative;z-index:1}.install-steps{display:grid;gap:10px;margin:14px 0}.install-step{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--paper)}.install-step b{display:block;margin-bottom:3px;color:var(--navy)}.install-step .step-no{width:27px;height:27px;flex:0 0 27px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:800}
.reading-session-hint{margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:#f0e6d1;color:#705323;font-size:12px;font-weight:700}

// Ofensiva de leitura: só conta tempo ativo na tela da Bíblia, com um capítulo aberto.
const STREAK_TARGET_SECONDS=420;
let readingTick=null;
function localDayKey(date=new Date()){
 const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');
 return `${y}-${m}-${d}`;
}
function streakData(){return get('readingStreak',{days:[],best:0});}
function secondsToday(){const all=get('readingSeconds',{});return Math.min(STREAK_TARGET_SECONDS,Number(all[localDayKey()]||0));}
function streakCount(days){
 const setDays=new Set(days||[]);let cursor=new Date();
 if(!setDays.has(localDayKey(cursor)))cursor.setDate(cursor.getDate()-1);
 let n=0;while(setDays.has(localDayKey(cursor))){n++;cursor.setDate(cursor.getDate()-1);}return n;
}
function recordReadingDay(){
 const data=streakData(),today=localDayKey();
 if(!data.days.includes(today))data.days.push(today);
 data.days.sort();data.best=Math.max(Number(data.best)||0,streakCount(data.days));
 set('readingStreak',data);renderStreakCard();toast('7 minutos concluídos! Seu dia entrou na ofensiva de leitura.');
}
function addReadingSecond(){
 if(page!=='biblia'||!bible.book||document.visibilityState!=='visible')return;
 const today=localDayKey(),all=get('readingSeconds',{}),current=Number(all[today]||0);
 if(current>=STREAK_TARGET_SECONDS)return;
 all[today]=Math.min(STREAK_TARGET_SECONDS,current+1);set('readingSeconds',all);
 if(all[today]>=STREAK_TARGET_SECONDS)recordReadingDay();
 updateReadingTimerUI();
}
function startReadingSession(){
 stopReadingSession();if(page!=='biblia'||!bible.book||document.visibilityState!=='visible'||!$('#chaptertext .verse-row'))return;
 updateReadingTimerUI();if(secondsToday()>=STREAK_TARGET_SECONDS)return;
 readingTick=setInterval(addReadingSecond,1000);
}
function stopReadingSession(){if(readingTick){clearInterval(readingTick);readingTick=null;}}
function updateReadingTimerUI(){
 const secs=secondsToday(),mins=Math.floor(secs/60),rem=secs%60,done=secs>=STREAK_TARGET_SECONDS;
 const label=`${mins}:${String(rem).padStart(2,'0')}`;
 const timer=$('#streakTimerLabel'),bar=$('#streakProgress'),hint=$('#readingSessionHint');
 if(timer)timer.textContent=done?'Leitura de hoje concluída ✓':`Hoje: ${mins} de 7 minutos`;
 if(bar)bar.style.width=(secs/STREAK_TARGET_SECONDS*100)+'%';
 if(hint)hint.textContent=done?'✦ Meta diária concluída! Sua sequência está protegida.':`✦ Leitura ativa: ${label} / 7:00`;
}
function renderStreakCard(){
 const data=streakData(),today=localDayKey(),days=data.days||[],count=streakCount(days),secs=secondsToday(),done=days.includes(today);
 const n=$('#streakCount'),caption=$('#streakCaption'),timer=$('#streakTimerLabel'),best=$('#streakBest'),bar=$('#streakProgress'),btn=$('.streak-button');
 if(n)n.textContent=count;
 if(caption)caption.textContent=done?'Meta de hoje concluída. Volte amanhã para manter sua sequência.':'Leia por 7 minutos com a Bíblia aberta para garantir o dia.';
 if(timer)timer.textContent=done?'Hoje: concluído ✓':`Hoje: ${Math.floor(secs/60)} de 7 minutos`;
 if(best)best.textContent=`Recorde: ${Number(data.best)||0} dias`;
 if(bar)bar.style.width=(done?100:secs/STREAK_TARGET_SECONDS*100)+'%';
 if(btn)btn.textContent=done?'Ler mais um pouco':'Começar leitura de hoje';
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stopReadingSession();else if(page==='biblia'&&bible.book)startReadingSession();});
window.addEventListener('pagehide',stopReadingSession);

ss="bookgrid">${books.map(b=>`<button class="book" onclick="openBook('${b[1]}','${b[0]}',1)"><b>${b[0]}</b><span class="small">${b[2]} capítulos</span></button>`).join('')}</div></div><div id="reader"></div>`}

const bookSlugs={GEN:'genesis',EXO:'exodus',LEV:'leviticus',NUM:'numbers',DEU:'deuteronomy',JOS:'joshua',JDG:'judges',RUT:'ruth','1SA':'1-samuel','2SA':'2-samuel','1KI':'1-kings','2KI':'2-kings','1CH':'1-chronicles','2CH':'2-chronicles',EZR:'ezra',NEH:'nehemiah',EST:'esther',JOB:'job',PSA:'psalms',PRO:'proverbs',ECC:'ecclesiastes',SNG:'song-of-solomon',ISA:'isaiah',JER:'jeremiah',LAM:'lamentations',EZK:'ezekiel',DAN:'daniel',HOS:'hosea',JOL:'joel',AMO:'amos',OBA:'obadiah',JON:'jonah',MIC:'micah',NAM:'nahum',HAB:'habakkuk',ZEP:'zephaniah',HAG:'haggai',ZEC:'zechariah',MAL:'malachi',MAT:'matthew',MRK:'mark',LUK:'luke',JHN:'john',ACT:'acts',ROM:'romans','1CO':'1-corinthians','2CO':'2-corinthians',GAL:'galatians',EPH:'ephesians',PHP:'philippians',COL:'colossians','1TH':'1-thessalonians','2TH':'2-thessalonians','1TI':'1-timothy','2TI':'2-timothy',TIT:'titus',PHM:'philemon',HEB:'hebrews',JAS:'james','1PE':'1-peter','2PE':'2-peter','1JN':'1-john','2JN':'2-john','3JN':'3-john',JUD:'jude',REV:'revelation'};
async function loadChapter(code,name,ch){
 stopReadingSession();bible.chapter=ch;let area=$('#chaptertext');if(!area)return;
 area.innerHTML='<p><span class="spinner"></span> Preparando sua leitura...</p>';
 const cachedAtStart=get('offlineBible_'+code+'_'+ch,null);if(!navigator.onLine&&cachedAtStart&&cachedAtStart.verses?.length){area.innerHTML=`<div class="notice">📥 Leitura offline · capítulo salvo neste aparelho</div><div class="row between"><b>${esc(name)} ${ch}</b><span class="offline-pill">Disponível offline</span></div>`+cachedAtStart.verses.map(v=>`<div class="verse-row" data-ref="${esc(name)} ${ch}:${v.number}" data-text="${esc(v.text)}" oncontextmenu="showVerseTools(event,this)" ontouchstart="startVerseHold(event,this)" ontouchend="cancelVerseHold()" ontouchmove="cancelVerseHold()"><span class="verse-num">${v.number}</span>${esc(v.text)}</div>`).join('');applyVerseHighlights();return;}
 const normalizeVerses=(payload)=>{
  let raw=payload?.data?.verses??payload?.verses??payload?.data?.content??payload?.content??payload?.data;
  if(raw&& !Array.isArray(raw) && Array.isArray(raw.verses))raw=raw.verses;
  if(raw&& !Array.isArray(raw) && Array.isArray(raw.content))raw=raw.content;
  if(!Array.isArray(raw))return [];
  return raw.map((v,i)=>{
   if(typeof v==='string')return {number:i+1,text:v};
   const textValue=v?.text??v?.content??v?.verse_text??v?.value??'';
   return {number:v?.number??v?.verse_number??v?.verse??v?.verseNumber??i+1,text:textValue};
  }).filter(v=>String(v.text||'').trim());
 };
 try{
  const slug=bookSlugs[code];if(!slug)throw Error('Livro não reconhecido.');
  const selected=bible.translation==='nva'?'nva':'almeida-livre';
  const versions=[...new Set([selected,selected==='nva'?'almeida-livre':'nva','bpm'])];
  let verses=[],credit='',used='',errors=[];
  for(const version of versions){
   try{
    const url=`https://api.midvash.com/v1/${version}/${slug}/${ch}`;
    const response=await fetch(url,{method:'GET',headers:{'Accept':'application/json'}});
    let body={};try{body=await response.json()}catch(_){throw Error('A resposta do serviço não veio em JSON.');}
    if(!response.ok)throw Error(body?.error?.message||`Serviço respondeu HTTP ${response.status}`);
    const parsed=normalizeVerses(body);
    if(!parsed.length)throw Error('O serviço não enviou os versículos esperados.');
    verses=parsed;used=version;credit=body?.meta?.copyright||body?.data?.copyright||body?.data?.version||version;break;
   }catch(err){errors.push(version+': '+(err.message||'falha'));}
  }

const bannedWords=['palavrãofake','merda','porra','caralho','puta','puto','viado','vadia','foda-se','cacete','bosta','piranha','arrombado','desgraça'];
function hasBlockedLanguage(text){const normalized=String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return bannedWords.some(w=>normalized.includes(w.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));}
function isForbiddenCommunityText(text){return hasBlockedLanguage(text)||/\b(lula|bolsonaro|pol[ií]tica|elei[cç][aã]o|vendo|vendo-se|compro|pix|namor[oa]|paquera|tinder|classificados|promo[cç][aã]o)\b/i.test(String(text||''));}

"row"><button class="btn light" onclick="likeFeed(${i})">♡ ${p.likes||0}</button><button class="btn light" onclick="commentFeed(${i})">Comentar</button><button class="btn light" onclick="shareText('${esc(p.title||'Conteúdo Pão da Vida')} — ${esc(p.text||'')}')">Compartilhar</button></div>${(p.comments||[]).map(c=>`<p class="small">↳ ${esc(c)}</p>`).join('')}</article>`).join(''):'<div class="card empty">Os estudos, fotos e vídeos oficiais aparecerão aqui quando a administração estiver conectada.</div>'}</div>`:`<div class="card"><h3>Compartilhe um pedido ou uma bênção</h3><p class="small">Conte seu testemunho, agradeça ou peça oração. Escreva com respeito e carinho.</p><select class="field" id="postType"><option>Pedido de oração</option><option>Testemunho</option><option>Benção / Gratidão</option></select><textarea class="field" id="postText" placeholder="Escreva sua mensagem..." style="margin-top:9px"></textarea><button class="btn" style="margin-top:9px" onclick="publishPost()">Publicar</button><p class="small">Filtro ativo contra palavras ofensivas. São proibidos conteúdos políticos, vendas, paquera, anúncios e palavrões.</p></div><div class="section-title">Mural de oração, bênçãos e testemunhos</div><div class="stack">${posts.length?posts.map((p,i)=>`<article class="card"><div class="row between"><b>${esc(p.type)}</b><span class="small">${esc(p.date)}</span></div><p class="post">${esc(p.text)}</p><div class="row"><button class="btn light" onclick="likePost(${i})">♡ ${p.likes||0}</button><button class="btn light" onclick="commentPost(${i})">Comentar</button><button class="btn light" onclick="shareText('${esc(p.text)}')">Compartilhar</button></div>${(p.comments||[]).map(c=>`<p class="small" style="margin:7px 0 0">↳ ${esc(c)}</p>`).join('')}</article>`).join(''):'<div class="card empty">Ainda não há pedidos ou testemunhos. Você pode ser o primeiro.</div>'}</div>`}`;

let privatePrayerPhoto='';
let privatePrayerAudioBlob=null;
let prayerRecorder=null,prayerChunks=[];
function privatePrayerPage(){
 const prayers=get('privatePrayers',[]);
 return `<div class="eyebrow">Seu espaço reservado</div><div class="section-title" style="margin-top:4px">🔒 Meus pedidos de oração</div><div class="card" style="border:1px solid #c6a15b">
 <div class="row between"><h3 style="margin:0">🔒 Pedidos de oração privados</h3><span class="pill">Só seu espaço</span></div>
 <p class="small" style="line-height:1.6">Este espaço é particular: seus pedidos não aparecem no mural da comunidade, não são compartilhados com outros usuários e não são enviados para publicação. Eles ficam guardados neste aparelho.</p>
 <div class="notice">Importante: como esta versão ainda não tem contas individuais nem bloqueio por senha, qualquer pessoa que consiga acessar este aparelho e os dados do navegador poderá ver os registros. Para privacidade protegida por usuário, será necessário implementar login e armazenamento seguro.</div>
 <div class="section-title">Nova oração</div>
 <label class="small">Essa oração é para quem? (Título / nome)</label><input class="field" id="privatePrayerTitle" maxlength="90" placeholder="Ex.: Minha mãe, Ana; meu filho, João..." style="margin:6px 0 12px">
 <label class="small">Essa oração é para qual causa?</label><p class="small">Adicione uma foto da pessoa ou algo que represente essa causa.</p><input class="field" id="privatePrayerPhotoInput" type="file" accept="image/*" capture="environment" onchange="previewPrivatePrayerPhoto(this)" style="margin:6px 0"><div id="privatePrayerPhotoPreview"></div>
 <label class="small" style="display:block;margin-top:12px">Qual é o objetivo de estar pedindo essa bênção?</label><p class="small">Conte o que você precisa que Deus faça por essa causa hoje.</p><textarea class="field" id="privatePrayerText" maxlength="2500" placeholder="Escreva seu pedido de oração com detalhes..." style="margin:6px 0 12px;min-height:115px"></textarea>
 <div class="card" style="background:#f8f4eb"><b>🎙️ Grave sua oração</b><p class="small">Se preferir, fale seu pedido em vez de escrever. A gravação fica salva neste aparelho.</p><div class="row" style="flex-wrap:wrap"><button class="btn" id="prayerRecordBtn" onclick="startPrivatePrayerRecording()">● Gravar áudio</button><button class="btn light" id="prayerStopBtn" onclick="stopPrivatePrayerRecording()" disabled>■ Parar gravação</button></div><div id="privatePrayerAudioStatus" class="small" style="margin-top:8px">Nenhum áudio gravado.</div></div>
 <button class="btn" style="width:100%;margin-top:13px" onclick="savePrivatePrayer()">🔒 Salvar meu pedido privado</button>
 </div>
 <div class="section-title">Minhas orações guardadas</div>
 <div class="stack">${prayers.length?prayers.map((q,i)=>`<article class="card"><div class="row between"><b>${esc(q.title||'Pedido de oração')}</b><span class="small">${esc(q.date||'')}</span></div>${q.photo?`<img src="${q.photo}" alt="Imagem da causa" style="width:100%;max-height:210px;object-fit:cover;border-radius:12px;margin:9px 0">`:''}<p class="post">${esc(q.text||'')}</p>${q.audio?`<button class="btn light" onclick="playPrivatePrayerAudio('${q.id}')">▶ Ouvir áudio gravado</button>`:''}<button class="btn ghost" style="margin-top:8px" onclick="deletePrivatePrayer('${q.id}')">Excluir este pedido</button></article>`).join(''):'<div class="card empty">Seus pedidos privados aparecerão aqui. Este mural é visível somente neste aparelho.</div>'}</div>`;
}
function previewPrivatePrayerPhoto(input){
 const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Escolha uma imagem.');
 const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,700/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);privatePrayerPhoto=c.toDataURL('image/jpeg',.68);const el=$('#privatePrayerPhotoPreview');if(el)el.innerHTML=`<img src="${privatePrayerPhoto}" alt="Prévia da foto" style="width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:8px">`;};img.src=reader.result;};reader.readAsDataURL(f);
}
function prayerAudioDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('PaoDaVidaPrivateAudio',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('audios'))req.result.createObjectStore('audios')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function storePrayerAudio(id,blob){const db=await prayerAudioDB();return new Promise((resolve,reject)=>{const tx=db.transaction('audios','readwrite');tx.objectStore('audios').put(blob,id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function getPrayerAudio(id){const db=await prayerAudioDB();return new Promise((resolve,reject)=>{const tx=db.transaction('audios','readonly'),req=tx.objectStore('audios').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}
async function removePrayerAudio(id){try{const db=await prayerAudioDB();const tx=db.transaction('audios','readwrite');tx.objectStore('audios').delete(id);}catch(e){}}
async function startPrivatePrayerRecording(){
 const status=$('#privatePrayerAudioStatus');
 if(!window.isSecureContext){if(status)status.textContent='O navegador bloqueou o microfone porque esta página não está em contexto seguro. Abra o projeto por uma prévia HTTPS/localhost ou pelo navegador com permissão de microfone.';return toast('A gravação exige uma página segura (HTTPS) e permissão de microfone.');}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){if(status)status.textContent='Este navegador não oferece gravação de áudio nesta visualização. Tente abrir no Chrome atualizado.';return toast('Gravação indisponível nesta visualização.');}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});prayerChunks=[];let mime='';for(const type of ['audio/webm;codecs=opus','audio/webm','audio/mp4']){if(MediaRecorder.isTypeSupported(type)){mime=type;break;}}prayerRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);prayerRecorder.ondataavailable=e=>{if(e.data&&e.data.size)prayerChunks.push(e.data)};prayerRecorder.onerror=e=>{if(status)status.textContent='Erro durante a gravação. Tente novamente.';toast('A gravação foi interrompida.');};prayerRecorder.onstop=()=>{privatePrayerAudioBlob=new Blob(prayerChunks,{type:prayerRecorder.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());if(status)status.textContent='Áudio gravado e pronto para salvar.';const a=$('#prayerRecordBtn'),b=$('#prayerStopBtn');if(a)a.disabled=false;if(b)b.disabled=true;};prayerRecorder.start(500);const a=$('#prayerRecordBtn'),b=$('#prayerStopBtn');if(a)a.disabled=true;if(b)b.disabled=false;if(status)status.textContent='Gravando... fale sua oração.';}catch(e){let msg=e.name==='NotAllowedError'?'Permissão do microfone negada. Libere o microfone nas permissões do navegador.':e.name==='NotFoundError'?'Nenhum microfone foi encontrado.':e.name==='NotReadableError'?'O microfone está sendo usado por outro aplicativo.':'Não foi possível iniciar: '+(e.message||e.name);if(status)status.textContent=msg;toast(msg);}
}
function stopPrivatePrayerRecording(){if(prayerRecorder&&prayerRecorder.state==='recording')prayerRecorder.stop();}
async function savePrivatePrayer(){
 const title=$('#privatePrayerTitle')?.value.trim(),text=$('#privatePrayerText')?.value.trim();if(!title)return toast('Diga para quem é esta oração.');if(!text&&!privatePrayerAudioBlob)return toast('Escreva o pedido ou grave um áudio.');
 const id='prayer_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);let audio=false;
 try{if(privatePrayerAudioBlob){await storePrayerAudio(id,privatePrayerAudioBlob);audio=true;}}catch(e){return toast('Não foi possível guardar o áudio. Tente gravar novamente.');}
 const all=get('privatePrayers',[]);all.unshift({id,title,text,photo:privatePrayerPhoto,date:new Date().toLocaleDateString('pt-BR'),audio});set('privatePrayers',all);
 privatePrayerPhoto='';privatePrayerAudioBlob=null;prayerChunks=[];render();toast('Seu pedido privado foi guardado neste aparelho.');
}
async function playPrivatePrayerAudio(id){try{const blob=await getPrayerAudio(id);if(!blob)return toast('Áudio não encontrado neste aparelho.');const url=URL.createObjectURL(blob);showModal('Sua oração gravada',`<audio controls autoplay style="width:100%" src="${url}"></audio><p class="small">Este áudio está guardado neste aparelho.</p>`);}catch(e){toast('Não foi possível abrir o áudio.');}}
async function deletePrivatePrayer(id){const all=get('privatePrayers',[]).filter(q=>q.id!==id);set('privatePrayers',all);await removePrayerAudio(id);render();toast('Pedido excluído.');}

function likePost(i){let p=get('posts',[]);p[i].likes=(p[i].likes||0)+1;set('posts',p);render()}function commentPost(i){let c=prompt('Escreva seu comentário:');if(c?.trim()){if(isForbiddenCommunityText(c))return toast('Comentário bloqueado: este espaço é apenas para conteúdo edificante.');let p=get('posts',[]);p[i].comments=p[i].comments||[];p[i].comments.push(c.trim());set('posts',p);render()}}
function spacePage(){let fav=get('favorites',[]),last=get('last',null),done=get('doneDays',{}),notes=get('verseNotes',{}),journal=get('journal',[]),profile=get('profile',{name:'' ,photo:'' });return `<section class="profile-panel"><div class="profile-avatar">${profile.photo?`<img src="${profile.photo}" alt="Foto do perfil">`:'✦'}</div><div class="profile-info"><span class="eyebrow">SEU PERFIL</span><h2>${esc(profile.name||'Sua caminhada de fé')}</h2><p>Personalize seu nome e sua foto.</p></div><button class="btn gold-btn" onclick="openProfile()">Editar</button></section><div class="eyebrow">Sua caminhada com Deus</div><div class="section-title" style="margin-top:4px">Meu Espaço</div><div class="grid"><div class="card"><div class="small">Versículos favoritos</div><div class="section-title">${fav.length}</div></div><div class="card"><div class="small">Anotações bíblicas</div><div class="section-title">${Object.keys(notes).length}</div></div></div><div class="section-title">Última leitura</div><div class="card row between">${last?`<div><b>${esc(last.book)} ${last.chapter}</b><div class="small">Continue de onde parou</div></div><button class="btn light" onclick="navigate('biblia');setTimeout(()=>openBook('${last.code}','${esc(last.book)}',${last.chapter}),50)">Abrir</button>`:'<span class="muted">Você ainda não começou a leitura.</span>'}</div><div class="section-title">Meus favoritos</div><div class="card">${fav.length?fav.map((f,i)=>`<div class="verse-row"><b>${esc(f.ref)}</b><p>${esc(f.text)}</p><button class="btn light" onclick="removeFavorite(${i})">Remover</button></div>`).join(''):'<p class="muted">Seus versículos favoritos aparecerão aqui.</p>'}</div><div class="section-title">Diário espiritual</div><div class="notice" style="margin-bottom:10px">🔒 <b>Seu diário é pessoal.</b> O que você escreve aqui não é publicado na comunidade. É um espaço entre você e Deus. As anotações ficam armazenadas neste aparelho; quem tiver acesso ao aparelho ou aos dados do navegador também poderá acessá-las.</div><div class="card"><textarea class="field" id="journalText" placeholder="O que você deseja registrar hoje? Uma oração, gratidão ou aprendizado..."></textarea><button class="btn" style="margin-top:9px" onclick="saveJournal()">Salvar no diário</button>${journal.map(j=>`<div class="verse-row"><div class="small">${esc(j.date)}</div>${esc(j.text)}</div>`).join('')}</div><div class="section-title">Minhas anotações</div><div class="card">${Object.keys(notes).length?Object.entries(notes).map(([k,v])=>`<div class="verse-row"><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join(''):'<p class="muted">Suas anotações feitas na Bíblia aparecerão aqui.</p>'}</div><div class="section-title">Meu progresso</div><div class="card">${[7,15,21,30].map(d=>`<div style="margin:10px 0"><div class="row between"><b>Jornada ${d} dias</b><span class="small">${(done[d]||[]).length}/${d}</span></div><div class="progress"><i style="width:${(done[d]||[]).length/d*100}%"></i></div></div>`).join('')}</div><div class="section-title">Histórico de leitura</div><div class="card">${get('readingHistory',[]).slice(0,12).map(h=>`<div class="verse-row"><b>${esc(h.book)} ${h.chapter}</b><div class="small">${esc(h.date)}</div></div>`).join('')||'<p class="muted">Suas leituras aparecerão aqui.</p>'}</div><details class="drawer"><summary>💛 Apoie o crescimento do Pão da Vida</summary><div class="drawer-content"><p class="muted">Contribuição voluntária para ajudar a manter e melhorar o aplicativo.</p><button class="btn" onclick="openDonation()">Ver como contribuir</button></div></details><button class="btn light" style="margin-top:14px" onclick="exportData()">Exportar meus dados</button>`}
function saveJournal(){let t=$('#journalText').value.trim();if(!t)return;let a=get('journal',[]);a.unshift({text:t,date:new Date().toLocaleString('pt-BR')});set('journal',a);render();toast('Registro salvo!')}
function saveFavorite(ref,text){let a=get('favorites',[]);if(!a.some(x=>x.ref===ref)){a.unshift({ref,text});set('favorites',a);toast('Versículo favoritado!')}else toast('Esse versículo já está nos favoritos.')}
function removeFavorite(i){let a=get('favorites',[]);a.splice(i,1);set('favorites',a);render()}
function noteVerse(ref){let n=get('verseNotes',{}),old=n[ref]||'';showModal('Anotação · '+ref,`<textarea class="field" id="versenote" placeholder="Escreva sua reflexão...">${esc(old)}</textarea><button class="btn" style="margin-top:10px" onclick="saveVerseNote('${esc(ref)}')">Salvar anotação</button>`)}
function saveVerseNote(ref){let n=get('verseNotes',{});n[ref]=$('#versenote').value;set('verseNotes',n);closeModal();toast('Anotação salva!')}

function openProfile(){
 let p=get('profile',{name:'',photo:''});
 showModal('Seu perfil',`<div class="profile-editor">
   <div class="profile-preview" id="profilePreview">${p.photo?`<img src="${p.photo}" alt="Sua foto">`:'✦'}</div>
   <label class="small">Seu nome</label>
   <input class="field" id="profileName" maxlength="40" placeholder="Como deseja ser chamado(a)?" value="${esc(p.name||'')}">
   <label class="small" style="display:block;margin-top:12px">Sua foto</label>
   <input class="field" type="file" id="profilePhoto" accept="image/*" onchange="previewProfilePhoto(this)">
   <p class="small">A foto é reduzida e salva somente neste aparelho.</p>
   <div class="row" style="margin-top:14px"><button class="btn" onclick="saveProfile()">Salvar perfil</button><button class="btn ghost" onclick="removeProfilePhoto()">Remover foto</button></div>
 </div>`);
}
let pendingProfilePhoto=null;
function previewProfilePhoto(input){
 const file=input.files&&input.files[0]; if(!file)return;
 if(!file.type.startsWith('image/'))return toast('Escolha um arquivo de imagem.');
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{
   const max=480,scale=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   pendingProfilePhoto=c.toDataURL('image/jpeg',0.78);
   $('#profilePreview').innerHTML=`<img src="${pendingProfilePhoto}" alt="Prévia da foto">`;
 };img.src=reader.result;};
 reader.readAsDataURL(file);
}
function saveProfile(){
 const name=$('#profileName').value.trim();
 const old=get('profile',{name:'',photo:''});
 set('profile',{name,photo:pendingProfilePhoto||old.photo||''});
 pendingProfilePhoto=null;closeModal();render();toast('Perfil atualizado!');
}
function removeProfilePhoto(){
 const p=get('profile',{name:'',photo:''});p.photo='';set('profile',p);pendingProfilePhoto=null;
 $('#profilePreview').textContent='✦';toast('Foto removida. Salve o perfil para confirmar.');
}
const harpaKnown=[[1,'Chuvas de Graça'],[2,'Saudosa Lembrança'],[3,'Plena Paz'],[4,'Deus Velará por Ti'],[5,'Ó Desce Fogo Santo'],[6,'Na Maldição da Cruz'],[7,'Cristo Cura Sim!'],[8,'Cristo, o Fiel Amigo'],[9,'Marchai, Soldados de Cristo'],[10,'Eu Te Louvo'],[11,'Ó Cristão, Eia Avante'],[12,'Vem Já, Pecador'],[13,'Jesus Comprou-me'],[14,'Gozo em Jesus'],[15,'Conversão'],[16,'Despertar para o Trabalho'],[17,'Pensando em Jesus'],[18,'Grata Nova'],[19,'O Convite de Cristo'],[20,'Olhai o Cordeiro de Deus'],[21,'Gloriosa Aurora']];
function openHymnal(){showModal('Harpa Cristã · hinário completo',`<div class="notice">🎼 Navegue pelos números em ordem de 1 até 640. O hinário e as letras online dependem da conexão e das permissões do site. Você pode salvar esta página nos favoritos do navegador, mas as letras externas não ficam disponíveis offline automaticamente.</div><input class="field" id="hymnSearch" placeholder="Buscar número ou título conhecido..." oninput="filterHymns(this.value)" style="margin:12px 0"><div id="hymnList" class="hymn-list">${hymnCards(Array.from({length:640},(_,i)=>{let h=harpaKnown.find(x=>x[0]===i+1);return [i+1,h?h[1]:'Hino '+(i+1)]}))}</div><div class="section-title">Letras e hinário online</div><div class="small" style="margin-bottom:8px">Se o site não permitir abrir incorporado, use o botão para acessar a versão oficial.</div><div style="height:62vh;border:1px solid var(--line);border-radius:12px;overflow:hidden"><iframe title="Harpa Cristã online" src="https://www.harpacrista.org/" style="width:100%;height:100%;border:0" loading="lazy"></iframe></div><p style="margin-top:10px"><a href="https://www.harpacrista.org/" target="_blank" rel="noopener">Abrir Harpa Cristã oficial</a></p>`)}
function hymnCards(list){return list.map(h=>`<div class="hymn-item"><div class="hymn-number">${h[0]}</div><div class="hymn-title">${esc(h[1])}</div><button class="btn light" onclick="showHymnLyrics(${h[0]},'${esc(h[1])}')">Letra online</button></div>`).join('')||'<p class="muted">Nenhum hino encontrado.</p>'}
function filterHymns(q){const el=$('#hymnList');if(!el)return;let term=q.trim().toLowerCase();el.innerHTML=hymnCards(Array.from({length:640},(_,i)=>{let h=harpaKnown.find(x=>x[0]===i+1);return [i+1,h?h[1]:'Hino '+(i+1)]}).filter(h=>String(h[0]).includes(term)||h[1].toLowerCase().includes(term)).slice(0,120))}
function showHymnLyrics(n,title){showModal('Harpa Cristã nº '+n+' · '+title,`<p class="small">Consulta online da letra do hino. O conteúdo é carregado do hinário público disponível na internet.</p><div style="height:68vh;border:1px solid var(--line);border-radius:12px;overflow:hidden"><iframe title="Letra do hino ${n}" src="https://www.harpacrista.org/?s=${encodeURIComponent(n+' '+title)}" style="width:100%;height:100%;border:0" loading="lazy"></iframe></div><p><a href="https://www.harpacrista.org/" target="_blank" rel="noopener">Abrir o site da Harpa Cristã</a></p>`)}

function openLifeTopics(){showModal('A Bíblia no dia a dia',`<p class="small">Encontre uma reflexão bíblica para situações reais. Estes textos oferecem acolhimento e orientação espiritual, sem substituir ajuda médica, psicológica, jurídica ou financeira quando necessária.</p><input class="field" id="lifeSearch" placeholder="Buscar assunto..." oninput="filterLifeTopics(this.value)"><div id="lifeTopicList" class="stack" style="margin-top:12px">${lifeTopicCards(lifeTopics)}</div>`)}

function showVerseTools(ev,el){ev.preventDefault();activeVerse=el;let box=$('#readerTools');if(!box){box=document.createElement('div');box.id='readerTools';box.className='reader-tools';document.body.append(box)}box.innerHTML=`<button onclick="verseAction('copy')">Copiar</button><button onclick="verseAction('share')">Compartilhar</button><button onclick="verseAction('favorite')">☆ Favoritar</button><button onclick="verseAction('highlight')">🖍️ Marca-texto</button><button onclick="verseAction('note')">✎ Anotar</button><button onclick="hideVerseTools()">Fechar</button>`;box.style.left=Math.max(8,Math.min(innerWidth-280,ev.clientX||100))+'px';box.style.top=Math.max(70,Math.min(innerHeight-100,ev.clientY||250))+'px';box.classList.add('show')}

function verseAction(action){if(!activeVerse)return;let ref=activeVerse.dataset.ref,text=activeVerse.dataset.text;if(action==='copy'){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text+' — '+ref).then(()=>toast('Versículo copiado.'));else toast('Seu navegador não permite copiar automaticamente.')}if(action==='share')shareText(text+' — '+ref);if(action==='favorite')saveFavorite(ref,text);if(action==='highlight'){let h=get('verseHighlights',[]);if(!h.includes(ref))h.push(ref);else h=h.filter(x=>x!==ref);set('verseHighlights',h);applyVerseHighlights();toast('Marca-texto atualizado.')}if(action==='note')noteVerse(ref);hideVerseTools()}

function openOfflineBibleLibrary(){
 const entries=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('pdv_offlineBible_'))continue;try{const d=JSON.parse(localStorage.getItem(k));if(d&&Array.isArray(d.verses)&&d.verses.length)entries.push(d)}catch{}}
 entries.sort((a,b)=>(a.name||'').localeCompare(b.name||'')||a.chapter-b.chapter);
 showModal('📥 Minha Bíblia offline',entries.length?`<p class="muted">Estes capítulos já foram abertos com internet e estão guardados neste aparelho.</p><div class="stack">${entries.map(d=>`<button class="book" style="width:100%" onclick="closeModal();navigate('biblia');setTimeout(()=>openBook('${esc(d.code)}','${esc(d.name)}',${Number(d.chapter)||1}),80)"><b>📖 ${esc(d.name)} ${d.chapter}</b><span class="small">${d.verses.length} versículos · disponível neste aparelho</span></button>`).join('')}</div>`:'<div class="empty"><div style="font-size:36px">📚</div><b>Nenhum capítulo salvo ainda</b><p>Abra um capítulo enquanto estiver conectado à internet. Ele ficará guardado automaticamente para leitura offline.</p></div>');
}
function downloadCurrentChapter(code,ch){let d=get('offlineBible_'+code+'_'+ch,null);if(!d)return toast('Abra o capítulo com internet primeiro.');let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=`Biblia_${code}_${ch}.json`;a.click();URL.revokeObjectURL(u);toast('Capítulo guardado no app e exportado para Downloads.')}

function dailyWord(date=new Date()){const start=new Date(date.getFullYear(),0,0);const day=Math.floor((date-start)/86400000);return dailyWords[(day-1)%dailyWords.length];}
function dailyPhrase(date=new Date()){const start=new Date(date.getFullYear(),0,0);const day=Math.floor((date-start)/86400000);return dailyPhrases[(day-1)%dailyPhrases.length];}
function renderDailyWord(){const v=dailyWord(),card=document.getElementById('dailyVerseCard');const t=document.getElementById('dailyVerseText'),r=document.getElementById('dailyVerseRef'),p=document.getElementById('dailyVersePhrase');if(t)t.textContent='“'+v[0]+'”';if(r)r.textContent=v[1];if(p)p.textContent=dailyPhrase();if(card){const themes={sunset:'linear-gradient(145deg,#653b63,#e69a76)',lavender:'linear-gradient(145deg,#403d78,#a98acb)',rose:'linear-gradient(145deg,#8b4966,#e8a7b4)',ocean:'linear-gradient(145deg,#174b68,#67aeb1)',forest:'linear-gradient(145deg,#244d43,#91a66f)'};card.style.background=themes[v[3]];}}

function openShareCard(){
 showModal('Criar cartão para compartilhar',`<div class="stack">
 <label>Versículo ou mensagem</label><textarea id="shareVerse" rows="3"></textarea>
 <label>Referência bíblica</label><input id="shareRef">
 <label>Fonte</label><select id="shareFont"><option value="Georgia">Elegante · Georgia</option><option value="Arial">Moderna · Arial</option><option value="serif">Clássica · Serif</option><option value="cursive">Manuscrita · Cursive</option></select>

 ['shareVerse','shareRef','shareFont'].forEach(id=>document.getElementById(id).addEventListener('input',updateSharePreview));const today=dailyWord();document.getElementById('shareVerse').value=today[0];document.getElementById('shareRef').value=today[1];window.pdvShareBg=today[3];setShareBg(today[3]);updateSharePreview();

function setShareBg(name){window.pdvShareBg=name;const p=document.getElementById('sharePreview');if(p){const b={sunset:'linear-gradient(145deg,#803f56,#e6a36d)',lavender:'linear-gradient(145deg,#503b70,#b27b91)',ocean:'linear-gradient(145deg,#173c59,#5b9eaa)',forest:'linear-gradient(145deg,#214d40,#8a9c69)',rose:'linear-gradient(145deg,#8e5368,#e8aeb5)'};p.style.background=b[name]||b.lavender;}}

function createShareCard(){
 const verse=document.getElementById('shareVerse')?.value||'Uma palavra de esperança para você.',ref=document.getElementById('shareRef')?.value||'',font=document.getElementById('shareFont')?.value||'Georgia';
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const themes={sunset:['#803f56','#e6a36d'],lavender:['#503b70','#b27b91'],ocean:['#173c59','#5b9eaa'],forest:['#214d40','#8a9c69'],rose:['#8e5368','#e8aeb5']};const colors=themes[window.pdvShareBg||'lavender'];const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,colors[0]);g.addColorStop(1,colors[1]);x.fillStyle=g;x.fillRect(0,0,1080,1350);
 x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=3;x.strokeRect(54,54,972,1242);x.textAlign='center';x.fillStyle='#fff';x.font='700 34px Arial';x.fillText('✦  PÃO DA VIDA  ✦',540,225);
 x.font=`54px ${font}`;const words=verse.split(/\s+/);let lines=[],line='';for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>850&&line){lines.push(line);line=w}else line=test;}if(line)lines.push(line);const lineHeight=76,startY=675-(lines.length*lineHeight)/2;lines.forEach((v,i)=>x.fillText(v,540,startY+i*lineHeight));
 x.fillStyle='#fff';x.font='bold 34px Arial';x.fillText(ref.toUpperCase(),540,1000);x.font='26px Arial';x.fillText('Leia a Bíblia: bible.com',540,1130);x.fillText(dailyPhrase(),540,1190);
 c.toBlob(async blob=>{if(!blob){toast('Não foi possível gerar a imagem.');return;}const file=new File([blob],'cartao-pao-da-vida.png',{type:'image/png'});const textMsg=`${verse}\n${ref}\nLeia a Bíblia: https://www.bible.com/pt/bible`;if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Pão da Vida',text:textMsg});}catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar agora.');}}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cartao-pao-da-vida.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);showModal('Imagem pronta',`<p>O cartão foi baixado. Anexe a imagem no Instagram ou WhatsApp.</p><a class="btn" style="display:block;text-align:center" href="https://wa.me/?text=${encodeURIComponent(textMsg)}" target="_blank" rel="noopener">Continuar no WhatsApp</a><a class="btn light" style="display:block;text-align:center;margin-top:8px" href="https://www.instagram.com/" target="_blank" rel="noopener">Abrir Instagram</a>`);}},'image/png');
}
